# Opt-in GPU-only new-KV store. Original unified YAML is unchanged.
# Choose a NEW namespace per experiment; use the same one for warm reuse.
chunk_size: 128
local_cpu: false
max_local_cpu_size: 8
enable_async_loading: true
use_layerwise: false
save_decode_cache: true
storage_plugins: [daosgds]
extra_config:
  storage_plugin.daosgds.module_path: lmcache_daos.gds_backend
  storage_plugin.daosgds.class_name: DaosGdsBackend
  daosgds.pool: discospool
  daosgds.container: kvcache
  daosgds.transport: object
  daosgds.root: /minji-gpu-store
  daosgds.object_namespace: "minji-gpu-store:"
  daosgds.object_library: /root/discos_minji/libdaosgdr.so
  daosgds.gpu_buffer_gb: 10
  daosgds.io_workers: 16
  daosgds.meta_workers: 16
  daosgds.store: true
  daosgds.store_path: gpu_direct  # rollback: host_staged, then restart process
