chunk_size: 2048
local_cpu: true
enable_async_loading: true
storage_plugins:
- daosgds
extra_config:
  storage_plugin.daosgds.module_path: lmcache_daos.dram_prefetch_backend
  storage_plugin.daosgds.class_name: DaosDramPrefetchBackend
  daosgds.pool: discospool
  daosgds.container: kvcache
  daosgds.transport: dfs
  daosgds.root: /minji-v2
  daosgds.object_namespace: 'minji-v2:'
  daosgds.object_library: /root/discos_minji/libdaosgdr.so
  daosgds.gpu_buffer_gb: 8
  daosgds.io_workers: 8
  daosgds.meta_workers: 8
  daosgds.store: true
  daosgds.cpu_prefetch_gpu_gb: 4.0
max_local_cpu_size: 4.0
