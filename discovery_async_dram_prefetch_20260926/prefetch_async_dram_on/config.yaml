chunk_size: 128
local_cpu: true
max_local_cpu_size: 8.0
cache_policy: LRU
enable_async_loading: true
use_layerwise: false
save_decode_cache: true
storage_plugins:
- daosgds
extra_config:
  storage_plugin.daosgds.module_path: lmcache_daos.store_probe_backend
  storage_plugin.daosgds.class_name: StoreProbeAsyncDramBackend
  daosgds.pool: discospool
  daosgds.container: kvcache
  daosgds.transport: object
  daosgds.object_namespace: 'minji-discovery-live-ddd02cc2e90e4f78ac750ff89da8c004:'
  daosgds.root: /minji-discovery-live-ddd02cc2e90e4f78ac750ff89da8c004
  daosgds.object_library: /root/discos_minji/libdaosgdr.so
  daosgds.gpu_buffer_gb: 10
  daosgds.io_workers: 16
  daosgds.meta_workers: 16
  daosgds.store: true
  daosgds.store_path: gpu_direct
  daosgds.async_dram: true
  daosgds.dram_promote_on_read: true
  daosgds.dram_mirror_max_pending_gb: 1
  daosgds.dram_mirror_max_age_ms: 100
  daosgds.probe_interval_ms: 20
  daosgds.dram_prefetch: true
  daosgds.cpu_prefetch_gpu_gb: 5
