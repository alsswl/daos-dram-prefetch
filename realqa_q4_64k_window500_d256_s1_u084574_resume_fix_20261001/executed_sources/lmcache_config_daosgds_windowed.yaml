# Opt-in sequential windowed reads. Restart vLLM after changing this file.
# retrieve_window_mib: 128 / 256 / 512 / 1024 ...; 0 = legacy full-batch baseline.
# Rounded DOWN to a whole number of KV chunks; cannot be smaller than one chunk.
# Qwen3-4B BF16, chunk_size=128: one chunk=18MiB; 500MiB means 27 chunks=486MiB.
# Initial support: one GPU/rank, non-layerwise V2 connector, BOTH prefetches OFF.
# Unlike recent async-OFF experiments, metadata lookup is synchronous in v1.
# Required environment: DAOS_GDS_STAGING_TRACE=/path/to/new/run/trace
chunk_size: 128
local_cpu: true
max_local_cpu_size: 256
enable_async_loading: false
use_layerwise: false
use_gpu_connector_v3: false
save_decode_cache: true
storage_plugins: [daosgds]
extra_config:
  storage_plugin.daosgds.module_path: lmcache_daos.windowed_demand_backend
  storage_plugin.daosgds.class_name: WindowedDemandBackend
  daosgds.demand_read_only: true
  daosgds.dram_prefetch: false
  daosgds.retrieve_window_mib: 500
  daosgds.retrieve_window_timeout_s: 5
  daosgds.pool: discospool
  daosgds.container: kvcache
  # Use a NEW private namespace per experiment. These are example-only names.
  daosgds.object_namespace: "minji-windowed-example:"
  daosgds.root: /minji-windowed-example
  daosgds.transport: object
  daosgds.object_library: /root/discos_minji/libdaosgdr.so
  daosgds.gpu_buffer_gb: 1
  daosgds.io_workers: 16
  daosgds.meta_workers: 16
  daosgds.store: true
  daosgds.store_path: gpu_direct
  daosgds.async_dram: true
  daosgds.dram_promote_on_read: true
  daosgds.dram_mirror_max_pending_gb: 1
  daosgds.dram_mirror_max_age_ms: 100
  daosgds.probe_interval_ms: 20
